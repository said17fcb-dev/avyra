<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avyra | Viajes a medida, diseñados para ti</title>
<meta name="description" content="Avyra diseña viajes a medida: vuelos, alojamiento y experiencias seleccionadas según tus fechas, gustos y presupuesto. Trato personal y propuestas únicas.">
<meta name="theme-color" content="#0e1b24">
<meta property="og:type" content="website">
<meta property="og:title" content="Avyra | Viajes a medida">
<meta property="og:description" content="Viajes diseñados a tu medida, con trato personal y atención al detalle.">
<meta property="og:image" content="https://images.unsplash.com/photo-1533105079780-92b9be482077?auto=format&fit=crop&w=1200&q=80">
<meta property="og:locale" content="es_ES">
<link rel="preconnect" href="https://images.unsplash.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0e1b24;
  --ink-2: #16293a;
  --ivory: #f6f1e7;
  --paper: #fbf8f2;
  --gold: #c2a36b;
  --gold-dark: #9c7f4a;
  --gold-soft: #e6d6b3;
  --muted: #5f6a70;
  --line: rgba(14,27,36,.12);
  --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --sans: "Jost", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --header-h: 76px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: var(--header-h); }
body {
  margin: 0;
  font-family: var(--sans);
  font-weight: 400;
  color: var(--ink);
  background: var(--paper);
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; }
a { text-decoration: none; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

.skip-link {
  position: absolute; left: -999px; top: 8px;
  background: var(--ink); color: #fff; padding: 10px 16px; z-index: 200;
}
.skip-link:focus { left: 8px; }

/* Header */
header {
  position: sticky; top: 0; z-index: 100;
  height: var(--header-h);
  display: flex; justify-content: space-between; align-items: center;
  padding: 0 7%;
  background: rgba(14,27,36,.94);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(194,163,107,.22);
  color: #fff;
}
.logo { display: flex; flex-direction: column; line-height: 1; }
.logo b {
  font-family: var(--serif); font-weight: 500; font-size: 28px;
  letter-spacing: .34em; padding-left: .34em; color: #fff;
}
.logo small {
  font-size: 9px; letter-spacing: .42em; text-transform: uppercase;
  color: var(--gold); margin-top: 5px; text-align: center; padding-left: .42em;
}
nav { display: flex; gap: 34px; align-items: center; }
nav a:not(.btn) {
  font-size: 12px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase;
  position: relative; color: #e8e2d4;
}
nav a:not(.btn)::after {
  content: ""; position: absolute; left: 0; bottom: -6px; width: 0; height: 1px;
  background: var(--gold); transition: width .3s;
}
nav a:not(.btn):hover { color: #fff; }
nav a:not(.btn):hover::after { width: 100%; }
.menu-toggle {
  display: none; background: none; border: 0; cursor: pointer;
  width: 44px; height: 44px; color: #fff;
}
.menu-toggle svg { width: 26px; height: 26px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 14px 30px;
  background: var(--gold); color: var(--ink);
  font-family: var(--sans); font-size: 12px; font-weight: 600;
  letter-spacing: .18em; text-transform: uppercase;
  border: 1px solid var(--gold); border-radius: 0; cursor: pointer;
  transition: background .3s, color .3s, border-color .3s, transform .3s;
}
.btn:hover { background: transparent; color: var(--gold); transform: translateY(-2px); }
.btn-outline { background: transparent; border-color: rgba(255,255,255,.7); color: #fff; }
.btn-outline:hover { background: #fff; border-color: #fff; color: var(--ink); }
.btn-ghost { background: transparent; color: var(--ink); border-color: var(--ink); }
.btn-ghost:hover { background: var(--ink); border-color: var(--ink); color: var(--gold-soft); }
.btn-block { width: 100%; }
header .btn { padding: 11px 22px; }
header .btn:hover { color: var(--gold-soft); }

/* Hero */
.hero {
  min-height: 680px;
  display: flex; align-items: center;
  padding: 110px 8%;
  color: #fff;
  background:
    linear-gradient(90deg, rgba(8,18,26,.92) 0%, rgba(8,18,26,.62) 55%, rgba(8,18,26,.28) 100%),
    url('https://images.unsplash.com/photo-1533105079780-92b9be482077?auto=format&fit=crop&w=1800&q=80')
    center/cover;
}
.hero-content { max-width: 700px; }
.eyebrow {
  display: inline-flex; align-items: center; gap: 14px;
  text-transform: uppercase; letter-spacing: .3em;
  font-size: 11px; font-weight: 500; color: var(--gold);
}
.eyebrow::before { content: ""; width: 38px; height: 1px; background: var(--gold); }
.center .eyebrow::after { content: ""; width: 38px; height: 1px; background: var(--gold); }
.eyebrow.dark { color: var(--gold-dark); }
.eyebrow.dark::before, .center .eyebrow.dark::after { background: var(--gold-dark); }
h1, h2, h3 { font-family: var(--serif); font-weight: 500; }
h1 { font-size: clamp(44px, 7vw, 84px); line-height: 1.02; margin: 22px 0 24px; letter-spacing: -.5px; }
h1 em, h2 em { font-style: italic; color: var(--gold); font-weight: 400; }
.hero p { font-size: 18px; font-weight: 300; max-width: 540px; margin: 0 0 36px; color: #e4e7e8; }
.hero-actions { display: flex; gap: 14px; flex-wrap: wrap; }
.hero-badges {
  display: flex; gap: 28px; flex-wrap: wrap;
  margin: 46px 0 0; padding: 0; list-style: none;
  font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #cfd6d9;
}
.hero-badges li { margin: 0; display: flex; align-items: center; gap: 10px; }
.hero-badges li::before { content: "◆"; color: var(--gold); font-size: 8px; }

/* Sections */
section { padding: 108px 8%; }
.section-head { max-width: 700px; margin-bottom: 54px; }
.section-head.center { margin-left: auto; margin-right: auto; text-align: center; }
h2 { font-size: clamp(34px, 4.6vw, 52px); line-height: 1.1; margin: 16px 0 16px; letter-spacing: -.3px; }
.section-head p, .muted { color: var(--muted); font-weight: 300; }
h3 { margin: 0 0 8px; }

.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 30px; }
.card { background: #fff; overflow: hidden; border: 1px solid var(--line); transition: transform .4s, box-shadow .4s; }
.card:hover { transform: translateY(-6px); box-shadow: 0 24px 50px rgba(14,27,36,.12); }
.card .img-wrap { overflow: hidden; }
.card img { width: 100%; height: 280px; object-fit: cover; display: block; transition: transform .9s ease; }
.card:hover img { transform: scale(1.06); }
.card-body { padding: 28px 28px 32px; }
.card h3 { font-size: 27px; }
.card p { color: var(--muted); margin: 0; font-weight: 300; }

/* Por qué Avyra */
.why { background: var(--ink); color: #fff; }
.why h2 { color: #fff; }
.why .section-head p { color: #b9c4ca; }
.why-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border-top: 1px solid rgba(194,163,107,.3); }
.why-item { padding: 38px 30px 10px 0; }
.why-item + .why-item { padding-left: 30px; border-left: 1px solid rgba(194,163,107,.18); }
.why-num { font-family: var(--serif); font-size: 44px; color: var(--gold); line-height: 1; margin-bottom: 18px; font-style: italic; }
.why-item h3 { font-size: 24px; color: #fff; }
.why-item p { margin: 0; color: #b9c4ca; font-size: 15px; font-weight: 300; }

/* Steps */
.steps { background: var(--ivory); }
.step-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 44px; }
.step { border-top: 1px solid var(--gold); padding-top: 24px; }
.step-number { font-family: var(--serif); font-size: 58px; line-height: 1; color: var(--gold-dark); font-style: italic; margin-bottom: 14px; }
.step h3 { font-size: 27px; }

/* Pricing */
.price-card {
  background: #fff; border: 1px solid var(--line);
  padding: 40px 34px; display: flex; flex-direction: column; position: relative;
  transition: transform .4s, box-shadow .4s;
}
.price-card:hover { transform: translateY(-6px); box-shadow: 0 24px 50px rgba(14,27,36,.1); }
.price-card.featured { background: var(--ink); color: #fff; border-color: var(--gold); }
.price-card.featured .muted { color: #b9c4ca; }
.price-card.featured li { color: #e4e7e8; }
.badge {
  position: absolute; top: -12px; left: 34px;
  background: var(--gold); color: var(--ink); font-size: 10px; font-weight: 600;
  padding: 5px 14px; letter-spacing: .22em; text-transform: uppercase;
}
.price-card h3 { font-size: 30px; }
.price { font-family: var(--serif); font-size: 46px; font-weight: 500; margin: 14px 0 8px; line-height: 1; }
.price-card.featured .price { color: var(--gold); }
.price-card ul { padding: 0; margin: 22px 0 32px; list-style: none; flex: 1; }
.price-card li { margin: 12px 0; padding-left: 24px; position: relative; font-size: 15px; font-weight: 300; }
.price-card li::before { content: "◆"; position: absolute; left: 0; top: 3px; color: var(--gold); font-size: 8px; }
.price-card.featured .btn:hover { color: var(--gold); }
.notice {
  max-width: 900px; margin: 44px auto 0; padding: 18px 24px;
  border: 1px solid var(--gold-soft); background: var(--ivory);
  color: #6a5b3f; font-size: 13.5px; font-weight: 300; text-align: center;
}

/* Form */
.form-section { background: var(--ivory); }
.form-wrap {
  max-width: 860px; margin: 0 auto; background: #fff;
  padding: 52px; border: 1px solid var(--line); box-shadow: 0 30px 60px rgba(14,27,36,.07);
}
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
.field { display: flex; flex-direction: column; gap: 7px; }
.field.full { grid-column: 1 / -1; }
label { font-size: 11px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: var(--gold-dark); }
input, select, textarea {
  font: inherit; font-weight: 300; padding: 13px 2px; border: 0; border-bottom: 1px solid #cfc8b8;
  border-radius: 0; background: transparent; color: var(--ink); width: 100%;
}
input:focus, select:focus, textarea:focus { outline: none; border-bottom-color: var(--gold-dark); box-shadow: 0 1px 0 var(--gold-dark); }
textarea { resize: vertical; min-height: 90px; }
.form-note { font-size: 13px; color: var(--muted); margin: 18px 0 0; text-align: center; font-weight: 300; }

/* FAQ */
.faq { max-width: 860px; margin: 0 auto; border-top: 1px solid var(--line); }
details { border-bottom: 1px solid var(--line); }
summary {
  cursor: pointer; padding: 24px 4px; font-family: var(--serif); font-size: 24px; font-weight: 500; list-style: none;
  display: flex; justify-content: space-between; align-items: center; gap: 14px;
}
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; font-family: var(--sans); font-weight: 200; font-size: 30px; color: var(--gold-dark); transition: transform .3s; line-height: 1; }
details[open] summary::after { transform: rotate(45deg); }
details p { margin: 0; padding: 0 4px 26px; color: var(--muted); font-weight: 300; }

/* Contact */
.contact {
  background:
    linear-gradient(rgba(8,18,26,.88), rgba(8,18,26,.88)),
    url('https://images.unsplash.com/photo-1530789253388-582c481c54b0?auto=format&fit=crop&w=1600&q=70') center/cover;
  color: #fff; text-align: center; padding: 130px 8%;
}
.contact h2 { color: #fff; }
.contact .eyebrow::after { content: ""; width: 38px; height: 1px; background: var(--gold); }
.contact p { color: #d3dade; max-width: 560px; margin: 0 auto 36px; font-weight: 300; }

/* Footer */
footer {
  background: #09131a; color: #8d9aa1;
  padding: 44px 8%; display: flex; gap: 18px; flex-wrap: wrap;
  justify-content: space-between; align-items: center; font-size: 13px; font-weight: 300;
}
footer .f-logo { font-family: var(--serif); font-size: 22px; letter-spacing: .34em; color: #fff; }
footer .f-logo span { display: block; font-family: var(--sans); font-size: 9px; letter-spacing: .4em; color: var(--gold); margin-top: 4px; }

/* Floating WhatsApp */
.wa-float {
  position: fixed; right: 22px; bottom: 22px; z-index: 90;
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--ink); color: var(--gold); border: 1px solid var(--gold);
  display: grid; place-items: center;
  box-shadow: 0 10px 28px rgba(0,0,0,.3); transition: transform .3s, background .3s, color .3s;
}
.wa-float:hover { transform: scale(1.08); background: var(--gold); color: var(--ink); }
.wa-float svg { width: 27px; height: 27px; fill: currentColor; }

/* Reveal */
.reveal { opacity: 0; transform: translateY(26px); transition: opacity .9s ease, transform .9s ease; }
.reveal.visible { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .reveal { opacity: 1; transform: none; transition: none; }
  * { transition: none !important; }
}

/* Responsive */
@media (max-width: 1000px) {
  .why-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .why-item:nth-child(3) { padding-left: 0; border-left: 0; }
  .why-item { padding-bottom: 30px; }
}
@media (max-width: 860px) {
  header { padding: 0 5%; }
  .menu-toggle { display: grid; place-items: center; }
  nav {
    position: absolute; top: var(--header-h); left: 0; right: 0;
    flex-direction: column; align-items: stretch; gap: 0;
    background: var(--ink); padding: 8px 5% 24px;
    border-bottom: 1px solid rgba(194,163,107,.25);
    display: none;
  }
  nav.open { display: flex; }
  nav a:not(.btn) { padding: 16px 4px; border-bottom: 1px solid rgba(255,255,255,.08); font-size: 13px; }
  nav a:not(.btn)::after { display: none; }
  nav .btn { margin-top: 18px; padding: 14px 22px; }
  .hero { padding: 80px 6%; min-height: 600px; }
  section { padding: 72px 6%; }
  .contact { padding: 90px 6%; }
  .cards, .step-grid { grid-template-columns: 1fr; }
  .card img { height: 250px; }
  .form-wrap { padding: 30px 22px; }
  .form-grid { grid-template-columns: 1fr; }
  footer { flex-direction: column; text-align: center; }
}
@media (max-width: 560px) {
  .why-grid { grid-template-columns: 1fr; }
  .why-item, .why-item + .why-item { padding-left: 0; border-left: 0; }
  .hero-actions .btn { width: 100%; }
  .logo b { font-size: 24px; }
}
</style>
</head>
<body>

<a class="skip-link" href="#main">Saltar al contenido</a>

<header>
  <a class="logo" href="#inicio" aria-label="Avyra, inicio">
    <b>AVYRA</b>
    <small>Viajes a medida</small>
  </a>
  <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 8h16M4 16h16"/></svg>
  </button>
  <nav id="menu" aria-label="Navegación principal">
    <a href="#servicios">Servicios</a>
    <a href="#como-funciona">Cómo funciona</a>
    <a href="#precios">Precios</a>
    <a href="#faq">Preguntas</a>
    <a class="btn" href="#solicitar">Pedir propuesta</a>
  </nav>
</header>

<main id="main">

<section class="hero" id="inicio">
  <div class="hero-content">
    <div class="eyebrow">Avyra · Viajes a medida</div>
    <h1>Viajes diseñados <em>solo para ti.</em></h1>
    <p>Cuéntanos dónde quieres ir y cuánto quieres invertir. Seleccionamos vuelos, alojamiento y experiencias para crear un viaje con tu sello personal.</p>
    <div class="hero-actions">
      <a class="btn" href="#solicitar">Pedir mi propuesta</a>
      <a class="btn btn-outline" href="#como-funciona">Cómo funciona</a>
    </div>
    <ul class="hero-badges">
      <li>Trato personal</li>
      <li>Propuesta a tu medida</li>
      <li>Precio claro desde el inicio</li>
    </ul>
  </div>
</section>

<section id="servicios">
  <div class="section-head reveal">
    <div class="eyebrow dark">El arte de viajar mejor</div>
    <h2>Nosotros seleccionamos. <em>Tú disfrutas.</em></h2>
    <p>Olvídate de horas comparando opciones. Organizamos tu viaje según tus fechas, tu estilo y tu presupuesto, cuidando cada detalle.</p>
  </div>
  <div class="cards">
    <article class="card reveal">
      <div class="img-wrap"><img loading="lazy" src="https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=800&q=75" alt="Avión sobrevolando las nubes"></div>
      <div class="card-body">
        <h3>Vuelos</h3>
        <p>Buscamos las mejores opciones para tus fechas y tu presupuesto.</p>
      </div>
    </article>
    <article class="card reveal">
      <div class="img-wrap"><img loading="lazy" src="https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=800&q=75" alt="Hotel junto a una piscina"></div>
      <div class="card-body">
        <h3>Alojamiento</h3>
        <p>Una selección de alojamientos acorde a tu estilo, ubicación y precio.</p>
      </div>
    </article>
    <article class="card reveal">
      <div class="img-wrap"><img loading="lazy" src="https://images.unsplash.com/photo-1530789253388-582c481c54b0?auto=format&fit=crop&w=800&q=75" alt="Paisaje de montaña durante un viaje"></div>
      <div class="card-body">
        <h3>Experiencias</h3>
        <p>Planes, visitas y vivencias pensadas para aprovechar cada día.</p>
      </div>
    </article>
  </div>
</section>

<section class="why">
  <div class="section-head center reveal">
    <div class="eyebrow">Por qué Avyra</div>
    <h2>Atención al detalle, <em>sin sorpresas.</em></h2>
    <p>Hablas con una persona real, no con un buscador.</p>
  </div>
  <div class="why-grid">
    <div class="why-item reveal"><div class="why-num">01</div><h3>A tu medida</h3><p>Cada propuesta se crea desde cero según tus fechas, gustos y presupuesto.</p></div>
    <div class="why-item reveal"><div class="why-num">02</div><h3>Tu tiempo, intacto</h3><p>Nos encargamos de comparar y filtrar para que tú solo elijas.</p></div>
    <div class="why-item reveal"><div class="why-num">03</div><h3>Trato directo</h3><p>Hablamos por WhatsApp, con respuestas claras y sin intermediarios.</p></div>
    <div class="why-item reveal"><div class="why-num">04</div><h3>Transparencia</h3><p>Alcance y precio acordados por escrito antes de empezar.</p></div>
  </div>
</section>

<section class="steps" id="como-funciona">
  <div class="section-head reveal">
    <div class="eyebrow dark">En tres pasos</div>
    <h2>Así empieza <em>tu viaje.</em></h2>
    <p>Un proceso sencillo, personal y sin complicaciones.</p>
  </div>
  <div class="step-grid">
    <div class="step reveal">
      <div class="step-number">I</div>
      <h3>Cuéntanos tu idea</h3>
      <p class="muted">Destino, fechas, presupuesto y qué tipo de viaje te apetece.</p>
    </div>
    <div class="step reveal">
      <div class="step-number">II</div>
      <h3>Diseñamos tu propuesta</h3>
      <p class="muted">Buscamos opciones y organizamos una propuesta adaptada a ti.</p>
    </div>
    <div class="step reveal">
      <div class="step-number">III</div>
      <h3>Recibe tu guía</h3>
      <p class="muted">Si contratas la planificación, recibirás las opciones seleccionadas y un itinerario organizado.</p>
    </div>
  </div>
</section>

<section id="precios">
  <div class="section-head center reveal">
    <div class="eyebrow dark">Servicio personalizado</div>
    <h2>Un viaje <em>pensado para ti.</em></h2>
    <p>Precios iniciales orientativos. El alcance y el precio final se confirman antes de empezar.</p>
  </div>
  <div class="cards">
    <article class="price-card reveal">
      <h3>Escapada</h3>
      <div class="price">Desde 15 €</div>
      <p class="muted">Para una escapada corta.</p>
      <ul>
        <li>Búsqueda de alojamiento</li>
        <li>Ideas de actividades</li>
        <li>Propuesta personalizada</li>
      </ul>
      <a class="btn btn-ghost btn-block" href="https://wa.me/34640904656?text=Hola%20Avyra%2C%20me%20interesa%20el%20servicio%20Escapada">Consultar</a>
    </article>
    <article class="price-card featured reveal">
      <span class="badge">Selección Avyra</span>
      <h3>Viaje a medida</h3>
      <div class="price">Desde 35 €</div>
      <p class="muted">Para planificar tu próximo viaje.</p>
      <ul>
        <li>Búsqueda de vuelos y alojamiento</li>
        <li>Actividades y lugares de interés</li>
        <li>Itinerario organizado</li>
      </ul>
      <a class="btn btn-block" href="https://wa.me/34640904656?text=Hola%20Avyra%2C%20me%20interesa%20el%20servicio%20Viaje%20a%20medida">Quiero mi viaje</a>
    </article>
