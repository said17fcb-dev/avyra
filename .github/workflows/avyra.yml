<script>
(function () {
  document.getElementById('year').textContent = new Date().getFullYear();

  var toggle = document.getElementById('menuToggle');
  var menu = document.getElementById('menu');
  function closeMenu() {
    menu.classList.remove('open');
    toggle.setAttribute('aria-expanded', 'false');
  }
  toggle.addEventListener('click', function () {
    var open = menu.classList.toggle('open');
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  menu.querySelectorAll('a').forEach(function (a) { a.addEventListener('click', closeMenu); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeMenu(); });

  var items = document.querySelectorAll('.reveal');
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) { en.target.classList.add('visible'); io.unobserve(en.target); }
      });
    }, { threshold: 0.12 });
    items.forEach(function (el) { io.observe(el); });
  } else {
    items.forEach(function (el) { el.classList.add('visible'); });
  }

  var form = document.getElementById('tripForm');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var nombre = form.nombre.value.trim();
    var destino = form.destino.value.trim();
    if (!nombre || !destino) {
      (nombre ? form.destino : form.nombre).focus();
      return;
    }
    var lines = [
      'Hola Avyra, quiero que me ayudéis a planificar un viaje.',
      '',
      'Nombre: ' + nombre,
      'Destino: ' + destino,
      'Fechas: ' + (form.fechas.value.trim() || 'por decidir'),
      'Viajeros: ' + form.personas.value,
      'Presupuesto: ' + (form.presupuesto.value.trim() || 'por definir'),
      'Servicio: ' + form.servicio.value
    ];
    var extra = form.comentarios.value.trim();
    if (extra) lines.push('', 'Comentarios: ' + extra);
    var url = 'https://wa.me/34640904656?text=' + encodeURIComponent(lines.join('\n'));
    window.open(url, '_blank', 'noopener');
  });
})();
</script>

